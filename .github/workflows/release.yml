# SPDX-License-Identifier: Apache-2.0
# Builds the Linux packages (.deb, AppImage, Flatpak bundle) and uploads them as workflow
# artifacts for the owner to test and publish by hand. This workflow never creates a GitHub
# release, never pushes tags and uses no secrets.
name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deb-appimage:
    name: .deb + AppImage
    # Oldest Ubuntu image in CI: binaries need a glibc at least as new as the build host's,
    # so building on 22.04 (glibc 2.35) keeps the .deb/AppImage usable on 22.04 and newer.
    runs-on: ubuntu-22.04
    env:
      # linuxdeploy is an AppImage; the runner has no usable FUSE 2, so let it self-extract.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev file desktop-file-utils appstream
      - name: Validate desktop entry and AppStream metainfo
        run: |
          desktop-file-validate packaging/linux/dev.atlasgit.app.desktop
          appstreamcli validate --no-net packaging/linux/dev.atlasgit.app.metainfo.xml
      - name: Build .deb and AppImage
        run: scripts/package.sh
      - name: Inspect .deb
        run: |
          deb="$(ls target/release/bundle/deb/*.deb)"
          dpkg-deb -I "$deb"
          dpkg-deb -I "$deb" | grep -F 'git (>= 1:2.20)'
          dpkg-deb -c "$deb"
      - uses: actions/upload-artifact@v4
        with:
          name: atlasgit-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: atlasgit-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      # Input of the Flatpak job (repack of the same release binary).
      - uses: actions/upload-artifact@v4
        with:
          name: atlasgit-binary
          path: target/release/atlasgit
          if-no-files-found: error
          retention-days: 1

  flatpak:
    name: Flatpak bundle
    needs: deb-appimage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: atlasgit-binary
          path: target/release
      - run: chmod +x target/release/atlasgit
      - name: Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build Flatpak bundle
        run: scripts/package-flatpak.sh
      - name: Smoke test (Git and SSH inside the sandbox)
        run: |
          flatpak install --user --noninteractive --bundle target/flatpak/AtlasGit-*.flatpak
          flatpak run --command=git dev.atlasgit.app --version
          flatpak run --command=ssh dev.atlasgit.app -V
      - uses: actions/upload-artifact@v4
        with:
          name: atlasgit-flatpak
          path: target/flatpak/*.flatpak
          if-no-files-found: error

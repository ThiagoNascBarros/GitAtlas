# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (Ubuntu ${{ matrix.os }}, Git ${{ matrix.git }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        git: [system]
        include:
          - os: ubuntu-24.04
            git: "2.20.5"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build minimum supported Git
        if: matrix.git != 'system'
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libexpat1-dev gettext zlib1g-dev
          curl -sSfL https://mirrors.edge.kernel.org/pub/software/scm/git/git-${{ matrix.git }}.tar.gz | tar xz
          make -C git-${{ matrix.git }} prefix=$HOME/git-min NO_TCLTK=1 -j"$(nproc)" install >/dev/null
          echo "AK_GIT=$HOME/git-min/bin/git" >> "$GITHUB_ENV"
          echo "$HOME/git-min/bin" >> "$GITHUB_PATH"
      - run: git --version
      - name: Test core crates
        run: cargo test -p ak-gitcli -p ak-core

  app:
    name: App (UI + Tauri shell)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev
      - run: pnpm --dir app/ui install --frozen-lockfile
      - run: pnpm --dir app/ui test
      - run: pnpm --dir app/ui build
      - run: node scripts/contrast.mjs
      - run: cargo build -p atlaskraken --features custom-protocol

# SPDX-License-Identifier: Apache-2.0
# Flatpak manifest for Git Atlas ("repack": it installs the release binary built by
# scripts/package.sh instead of compiling the Rust/TypeScript sources inside flatpak-builder).
# Build it with scripts/package-flatpak.sh, which checks the binary and the runtime first.
# A from-source manifest for Flathub (vendored cargo/pnpm sources) is a later step.
id: dev.atlasgit.app
# GNOME 51 is the newest stable GNOME runtime (built on freedesktop-sdk 26.08). Its Platform ships
# WebKitGTK 4.1 (webkit2gtk-4.1, the GTK 3 + libsoup 3 API that Tauri 2 links against), GTK 3,
# libsecret, gnupg and the OpenSSH client, but not Git (Git is only in the Sdk), so Git is built below.
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: atlasgit
finish-args:
  # X11 shared memory; WebKitGTK and GTK need it under X11/XWayland.
  - --share=ipc
  # Native Wayland window, with X11 only where Wayland is not available.
  - --socket=wayland
  - --socket=fallback-x11
  # GPU acceleration for the WebKitGTK renderer (the commit graph is a canvas).
  - --device=dri
  # git fetch/pull/push over HTTPS and SSH.
  - --share=network
  # Repositories can live anywhere under home; also exposes ~/.gitconfig, ~/.config/git,
  # ~/.ssh (keys, known_hosts, config) and ~/.gnupg. The owner may narrow this later.
  - --filesystem=home
  # ssh-agent of the session, so SSH remotes work with keys already unlocked on the host.
  - --socket=ssh-auth
  # Secret Service (GNOME Keyring/KWallet) for the bundled git-credential-libsecret helper.
  - --talk-name=org.freedesktop.secrets
  # gpg-agent sockets of the host, so commits/tags can be signed with the user's GnuPG keys.
  - --filesystem=xdg-run/gnupg:ro
modules:
  # Git >= 2.20 is required for every write (all writes go through the git CLI).
  - name: git
    buildsystem: simple
    build-commands:
      - make -j"${FLATPAK_BUILDER_N_JOBS}" prefix=/app NO_TCLTK=YesPlease NO_PERL=YesPlease NO_PYTHON=YesPlease NO_RUST=YesPlease
        INSTALL_SYMLINKS=YesPlease all
      - make prefix=/app NO_TCLTK=YesPlease NO_PERL=YesPlease NO_PYTHON=YesPlease NO_RUST=YesPlease INSTALL_SYMLINKS=YesPlease
        install
      # Lets `credential.helper=libsecret` (short name) work inside the sandbox.
      - make -C contrib/credential/libsecret
      - install -Dm755 contrib/credential/libsecret/git-credential-libsecret -t /app/libexec/git-core/
    cleanup:
      - /share/man
    sources:
      # Pinned by tag and commit (flatpak-builder refuses a tag that does not point at the commit).
      - type: git
        url: https://github.com/git/git.git
        tag: v2.56.0
        commit: a018953688f1b10bddf91bff8747068f5f4746a4

  - name: atlasgit
    buildsystem: simple
    build-commands:
      - install -Dm755 atlasgit -t /app/bin/
      - install -Dm644 dev.atlasgit.app.desktop -t /app/share/applications/
      - install -Dm644 dev.atlasgit.app.metainfo.xml -t /app/share/metainfo/
      - |
        for size in 32 48 64 128 256; do
          install -Dm644 "icons/${size}x${size}.png" "/app/share/icons/hicolor/${size}x${size}/apps/dev.atlasgit.app.png"
        done
      - install -Dm644 icons/icon.png /app/share/icons/hicolor/512x512/apps/dev.atlasgit.app.png
    sources:
      # Release binary from scripts/package.sh (UI embedded, custom-protocol feature).
      - type: file
        path: ../../target/release/atlasgit
      - type: file
        path: ../linux/dev.atlasgit.app.desktop
      - type: file
        path: ../linux/dev.atlasgit.app.metainfo.xml
      - type: file
        path: ../../app/src-tauri/icons/32x32.png
        dest: icons
      - type: file
        path: ../../app/src-tauri/icons/48x48.png
        dest: icons
      - type: file
        path: ../../app/src-tauri/icons/64x64.png
        dest: icons
      - type: file
        path: ../../app/src-tauri/icons/128x128.png
        dest: icons
      - type: file
        path: ../../app/src-tauri/icons/256x256.png
        dest: icons
      - type: file
        path: ../../app/src-tauri/icons/icon.png
        dest: icons

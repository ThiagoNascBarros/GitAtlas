[workspace]
resolver = "2"
members = ["crates/ak-gitcli", "crates/ak-core", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 4

[package]
name = "ak-core"
description = "AtlasKraken core: repository reading and commit graph layout"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ak-gitcli = { path = "../ak-gitcli" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
gix = { version = "0.89", default-features = false, features = ["sha1", "max-performance-safe"], optional = true }

[features]
# In-process reads via gitoxide (SDD §1.2). Off by default: heavy to compile.
gix-reader = ["dep:gix"]

[dev-dependencies]

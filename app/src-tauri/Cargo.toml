[package]
name = "atlaskraken"
description = "AtlasKraken desktop Git client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ak-core = { path = "../../crates/ak-core", features = ["gix-reader"] }
ak-gitcli = { path = "../../crates/ak-gitcli" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
notify = "6"
serde.workspace = true
serde_json.workspace = true

[features]
# Embeds the built UI (app/ui/dist) instead of loading the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
